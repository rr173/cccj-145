name: cccj-145 task 1 approved LFS publication repair
'on':
  push:
    branches:
      - maintenance/cccj-145-001-lfs-20261116t222611
permissions:
  contents: write
jobs:
  exact-lfs-object:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - name: Reproduce and hash-check original DICOM bytes
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64,hashlib,json,os
          from pathlib import Path
          root=Path('.git/lfs/objects')
          oid='15e030203ecf1c2c8fd8e269c407b5dd9d8fe3025479b5b50165fe2992ec5969'
          path=root/oid[:2]/oid[2:4]/oid
          path.parent.mkdir(parents=True,exist_ok=True)
          with path.open('wb') as stream:
              stream.write(base64.b64decode(''))
              stream.truncate(1073742456)
          h=hashlib.sha256()
          with path.open('rb') as stream:
              for block in iter(lambda:stream.read(4*1024*1024),b''):h.update(block)
          assert path.stat().st_size==1073742456
          assert h.hexdigest()==oid
          print('Verified original DICOM bytes',oid,flush=True)
          PYCODE
      - name: Upload only approved LFS object
        run: git lfs push --object-id origin 15e030203ecf1c2c8fd8e269c407b5dd9d8fe3025479b5b50165fe2992ec5969
      - name: Fetch published LFS commit
        shell: bash
        run: |
          git init /tmp/cccj-145-lfs-readback
          git -C /tmp/cccj-145-lfs-readback remote add origin https://github.com/rr173/cccj-145.git
          git -C /tmp/cccj-145-lfs-readback fetch --no-tags origin 664f36e1a4871525dae95ac97743f513c089f9a3:refs/remotes/origin/pointwise-artifact
      - name: Download and verify published LFS objects
        shell: bash
        working-directory: /tmp/cccj-145-lfs-readback
        run: |
          git lfs fetch origin refs/remotes/origin/pointwise-artifact
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          rows=[{'path': 'dicom_catalog/data/demo_samples/delivery2/scanner3/late/bigpixel.dcm', 'sha256': '15e030203ecf1c2c8fd8e269c407b5dd9d8fe3025479b5b50165fe2992ec5969', 'bytes': 1073742456}, {'path': 'dicom_catalog/data/samples/delivery2/scanner3/late/bigpixel.dcm', 'sha256': '15e030203ecf1c2c8fd8e269c407b5dd9d8fe3025479b5b50165fe2992ec5969', 'bytes': 1073742456}]
          for row in rows:
              oid=row['sha256'];path=Path('.git/lfs/objects')/oid[:2]/oid[2:4]/oid
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda:stream.read(4*1024*1024),b''):h.update(block)
              assert path.stat().st_size==row['bytes']
              assert h.hexdigest()==oid
          Path('lfs-readback.json').write_text(json.dumps({'published_commit':'664f36e1a4871525dae95ac97743f513c089f9a3','files':rows},indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: lfs-readback
          path: /tmp/cccj-145-lfs-readback/lfs-readback.json
